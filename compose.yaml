services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=sqlite:///./foh.db
      # Ollama runs on the host machine, not in this container
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # 3b handles assistant tool-calling far more reliably than the 1b default
      - OLLAMA_MODEL=llama3.2:3b

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_USE_MOCK=false
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
